name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build podman image
        run: podman build -t ghcr.io/gabriel-104/ai_inventory:latest -f Containerfile .

      - name: Push podman image
        run: podman push ghcr.io/gabriel-104/ai_inventory:latest

  deploy:
    needs: test
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check podman on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: podman info

      - name: Check podman on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: podman info

      - name: Log in to GitHub Container Registry
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_PASS | podman login ghcr.io --username $env:GHCR_USER --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: podman pull --platform linux/amd64 ghcr.io/gabriel-104/ai_inventory:latest

      - name: Pull image on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: podman pull --platform linux/amd64 ghcr.io/gabriel-104/ai_inventory:latest

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $existing = podman ps -aq --filter "name=^/portfolio-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($existing) {
            podman rm -f portfolio-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          podman run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 -e "GEMINI_API_KEY=$env:GEMINI_API_KEY" ghcr.io/gabriel-104/ai_inventory:latest
          exit $LASTEXITCODE

      - name: Deploy on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          existing=$(podman ps -aq --filter "name=^/portfolio-app$")
          if [ -n "$existing" ]; then
            podman rm -f portfolio-app
          fi

          podman run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY ghcr.io/gabriel-104/ai_inventory:latest
